[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-service"
version = "0.1.0"
description = "RAG HTTP-Service."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.0",
    "httpx==0.27.2",
    "qdrant-client==1.9.1",
    "pydantic-settings==2.6.0",
    "python-dotenv==1.0.1",
    "gitpython==3.1.43",
    "tiktoken==0.7.0",
]

[tool.setuptools]
packages = ["app"]
