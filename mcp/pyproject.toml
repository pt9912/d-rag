[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-mcp-gateway"
version = "0.2.0"
description = "MCP-Gateway zum RAG-Service."
requires-python = ">=3.11"
dependencies = [
    "uvicorn[standard]==0.32.0",
    "httpx==0.27.2",
    "mcp==1.21.0",
    "starlette==0.41.3",
]

[tool.setuptools]
packages = ["app"]
