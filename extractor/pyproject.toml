[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-extractor"
version = "0.1.0"
description = "Dokument-Extraktionsservice."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.0",
    "pypdf==5.1.0",
    "python-multipart==0.0.16",
    "httpx==0.27.2",
]

[tool.setuptools]
packages = ["app"]
