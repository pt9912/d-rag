version: "3.1"

rules:
  - rule: Begruessung
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Verabschiedung mit Reset
    steps:
      - intent: goodbye
      - action: utter_goodbye
      - action: action_reset_context
      - active_loop: null

  - rule: Danke
    steps:
      - intent: thank
      - action: utter_thank

  - rule: Hilfe
    steps:
      - intent: help
      - action: utter_help

  - rule: NLU Fallback
    steps:
      - intent: nlu_fallback
      - action: utter_ask_rephrase

  - rule: Out of scope
    steps:
      - intent: out_of_scope
      - action: utter_out_of_scope

  - rule: RAG Form aktivieren
    steps:
      - intent: ask_rag
      - action: rag_form
      - active_loop: rag_form

  - rule: RAG Form abschicken
    condition:
      - active_loop: rag_form
    steps:
      - action: rag_form
      - active_loop: null
      - action: action_query_rag

  - rule: Form abbrechen bei nein
    condition:
      - active_loop: rag_form
    steps:
      - intent: deny
      - action: utter_cancel
      - action: action_reset_context
      - active_loop: null

  - rule: Rolle liefern waehrend Form
    condition:
      - active_loop: rag_form
    steps:
      - intent: provide_role
      - action: rag_form

  - rule: Bestaetigung waehrend Form
    condition:
      - active_loop: rag_form
    steps:
      - intent: affirm
      - action: rag_form
