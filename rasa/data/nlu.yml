version: "3.1"

nlu:
  - intent: ask_rag
    examples: |
      - wie deploye ich den rag service?
      - kannst du mir erklaeren wie die suche funktioniert?
      - ich brauche infos zur architektur des systems
      - wo finde ich die api dokumentation?
      - wie starte ich das projekt lokal?
      - erklaere mir den extraktor
      - welche rolle hat qdrant im system?
      - hast du infos zum [deployment](topic)?
      - zeig mir eine [faq](doc_type) zu berechtigungen
      - ich suche eine [anleitung](doc_type) fuer tests
      - fragen zum [vektorstore](topic) habe ich
      - gibt es einen leitfaden fuer rag?
      - was steht in den [adrs](doc_type) zum [retrieval](topic)?
      - hast du eine zusammenfassung zu [monitoring](topic)?
      - ich brauche hintergrund zu [rollenrechten](topic)

  - intent: greet
    examples: |
      - hallo
      - hi
      - guten tag
      - moin
      - guten morgen
      - servus

  - intent: goodbye
    examples: |
      - tschues
      - bis spaeter
      - auf wiedersehen
      - machs gut
      - wir hoeren uns

  - intent: help
    examples: |
      - was kannst du?
      - wie arbeitest du?
      - welche infos brauchst du von mir?
      - wie hilft mir der bot?
      - was sind deine faehigkeiten?

  - intent: thank
    examples: |
      - danke
      - vielen dank
      - super, danke dir
      - merci
      - passt so, danke

  - intent: out_of_scope
    examples: |
      - erzaehle einen witz
      - wie ist das wetter heute?
      - spiel musik
      - wie hoch ist der eiffelturm?
      - bestell mir eine pizza
      - erzähl mir was ueber das wetter

  - intent: affirm
    examples: |
      - ja
      - genau
      - klingt gut
      - passt
      - richtig

  - intent: deny
    examples: |
      - nein
      - nicht wirklich
      - lieber nicht
      - das passt nicht
      - stop

  - intent: provide_topic
    examples: |
      - [deployment](topic)
      - es geht um [architektur](topic)
      - thema ist [monitoring](topic)
      - [rollen](topic) und berechtigungen
      - [tests](topic)
      - [vektorstore](topic)

  - intent: provide_doc_type
    examples: |
      - eine [anleitung](doc_type)
      - [adr](doc_type)
      - [faq](doc_type)
      - [leitfaden](doc_type)
      - [howto](doc_type)

  - intent: provide_role
    examples: |
      - ich bin [admin](role)
      - als [dev](role) brauche ich das
      - [ops](role)
      - [product](role)
      - nutzerrolle ist [tester](role)
